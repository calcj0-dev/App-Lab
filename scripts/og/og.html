<!doctype html>
<!-- サイトの OGP 画像の元（設計書 6.1）。npm run og で 1200×630 の public/og.png にする -->
<!-- 背景に並べるアプリ（オーナーが決定、2026-11-13）：TAMERU・積立投資を超えろ！・宝くじ100連ガチャ・LIFE & WEALTH・投資キャラ診断・シティチェイス -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    position: relative;
    background: #0f1514;
    color: #ffffff;
    font-family: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic UI', 'Meiryo', sans-serif;
  }
  /* アプリの画像を傾けて敷き詰め、暗くする */
  .wall {
    position: absolute;
    inset: -60px -80px;
    display: grid;
    grid-template-columns: repeat(4, 330px);
    gap: 18px;
    transform: rotate(-8deg);
    opacity: 0.55;
  }
  .wall img { width: 330px; height: 173px; border-radius: 12px; object-fit: cover; }
  .panel {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 900px;
    box-sizing: border-box;
    padding: 46px 56px;
    border-radius: 32px;
    background: rgba(15, 118, 110, 0.94);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    text-align: center;
  }
  .brand { display: flex; align-items: center; justify-content: center; gap: 22px; }
  .logo {
    width: 86px; height: 86px; border-radius: 20px; background: #ffffff;
    display: flex; align-items: center; justify-content: center;
  }
  .logo svg { width: 52px; height: 52px; }
  h1 { margin: 0; font-size: 84px; font-weight: 800; line-height: 1; }
  .sub { margin: 26px 0 0; font-size: 40px; font-weight: 800; line-height: 1.4; }
  .note { margin: 18px 0 0; font-size: 28px; font-weight: 700; opacity: 0.9; }
</style>
</head>
<body>
  <div class="wall">
    <img src="../../public/images/tameru.webp" alt="">
